<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Produtos - Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-layout">
        <div class="page-brand">JB LATICÍNIOS</div>

        <div class="page-card">
            <div class="page-header-center">
                <span class="page-pill-title">LISTA DE PRODUTOS</span>
            </div>

            <div class="page-actions space-between">
                <a href="menu.html" class="btn btn-gray">Voltar</a>
                <a href="produto-cadastro.html" class="btn btn-green">+ Cadastrar Novo Produto</a>
            </div>

            <div class="table-wrapper" style="margin-top: 20px;">
                <table>
                    <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Categoria</th>
                        <th>Preço</th>
                        <th>Quantidade (KG)</th>
                        <th>Ações</th>
                    </tr>
                    </thead>
                    <tbody id="tabelaProdutos">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="produto-listagem.js"></script>
</body>
</html>
