<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produto - Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-layout">
        <div class="page-brand">JB LATICÍNIOS</div>

        <div class="page-card">
            <div class="page-header-center">
                <span class="page-pill-title">NOVO REGISTRO DE PRODUTO</span>
            </div>

            <form id="produtoForm">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Nome do Produto" required>
                
                <label for="preco">Preço:</label>
                <input type="number" id="preco" placeholder="Preço do Produto" step="0.01" min="0" required>
                
                <label for="tipo">Categoria:</label>
                <input type="text" id="tipo" placeholder="Tipo do Produto" required>
                
                <label for="quantidade">Quantidade (KG):</label>
                <input type="number" id="quantidade" placeholder="Quantidade em KG (inteiro)" step="0.01" min="0" required>
                
                <label for="dataVencimento">Data Vencimento:</label>
                <input type="date" id="dataVencimento" required>

                <div class="page-actions space-between">
                    <button type="submit" class="btn btn-green">SALVAR</button>
                    <span style="color: #e5e7eb; font-style: italic;">Mensagem de status aparecerá aqui</span>
                    <a href="menu.html" class="btn btn-gray">Voltar</a>
                </div>
            </form>
        </div>
    </div>

    <script src="produto-cadastro.js"></script>
</body>
</html>
