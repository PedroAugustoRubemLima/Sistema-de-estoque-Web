<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Registrar Venda - Sistema de Estoque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-layout">
        <div class="page-brand">JB LATICÍNIOS</div>

        <div class="page-card">
            <div class="page-header-center">
                <span class="page-pill-title">REGISTRAR NOVA VENDA</span>
            </div>

            <form id="vendaForm">
                <label for="clienteId">Cliente:</label>
                <select id="clienteId" required>
                    <option value="">Selecione um cliente</option>
                </select>
                
                <label for="funcionarioId">Funcionário:</label>
                <select id="funcionarioId" required>
                    <option value="">Selecione um funcionário</option>
                </select>

                <h3 style="margin: 20px 0 10px 0; color: #e5e7eb;">Itens da Venda</h3>
                <div id="itensVenda">
                    <div class="item-venda">
                        <label for="produtoId0">Produto:</label>
                        <select id="produtoId0" name="produtoId" required>
                            <option value="">Selecione um produto</option>
                        </select>
                        
                        <label for="quantidade0">Quantidade:</label>
                        <input type="number" id="quantidade0" name="quantidade" step="0.01" min="0.01" required>
                        
                        <label for="precoUnitario0">Preço Unitário:</label>
                        <input type="number" id="precoUnitario0" name="precoUnitario" step="0.01" min="0.01" required>
                    </div>
                </div>

                <div class="page-actions space-between">
                    <button type="button" id="adicionarItem" class="btn btn-blue">+ Adicionar Produto</button>
                    <button type="submit" class="btn btn-green">Finalizar Venda</button>
                </div>
            </form>

            <div class="page-actions" style="justify-content: flex-end; margin-top: 18px;">
                <a href="historico-vendas.html" class="btn btn-gray">Histórico de Vendas</a>
                <a href="menu.html" class="btn btn-gray">Voltar</a>
            </div>
        </div>
    </div>

    <script src="registrar-venda.js"></script>
</body>
</html>
